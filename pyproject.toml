[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "morning-scout"
version = "1.0.0"
description = "A privacy-first daily research assistant that sends only what's new, every morning."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "google-genai>=1.0",
    "Markdown>=3.5",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
morning-scout = "morning_scout.__main__:main"

[tool.setuptools.packages.find]
include = ["morning_scout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# User-facing text is intentionally Turkish (e.g. the dotless "ı").
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"morning_scout/messages.py" = ["E501"]
