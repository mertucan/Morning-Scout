# =====================================================================
#  Morning Scout configuration (example)
#  Copy this file into your secret Gist as "config.yaml" and edit it.
#  Bu dosyayı secret Gist'ine "config.yaml" adıyla kopyala ve düzenle.
#
#  Tips / İpuçları:
#   - Every list entry starts with "- " (dash + space).
#     Her liste satırı "- " (tire + boşluk) ile başlar.
#   - Use spaces, never tabs. / Girinti için TAB değil boşluk kullan.
#   - Put text containing ":" or "#" in quotes.
#     İçinde ":" veya "#" geçen metni tırnak içine al.
# =====================================================================

# An entry in "news" or "searches" is plain text, or a block with:
#   query: what to search for
#   topic: heading in the digest; entries with the same topic are grouped
#   sites: searches only; restrict to these domains (e.g. x.com, instagram.com)
#   focus: instruction for the summary; results that don't match are left out
# "news" ve "searches" maddeleri düz metin olabilir ya da şu alanlarla yazılır:
#   query: aranacak ifade
#   topic: e-postadaki başlık; aynı topic'e sahip maddeler birlikte gruplanır
#   sites: sadece searches için; bu sitelerle sınırla (ör. x.com, instagram.com)
#   focus: özet için talimat; uymayan sonuçlar e-postaya girmez

# Google News searches (articles from the last 24 hours).
# Google Haberler'de aranacak ifadeler (son 24 saat).
news:
  - artificial intelligence
  - query: open source LLM release
    topic: Open models
    focus: Only releases with downloadable model weights.

# Web searches via Tavily. Questions work well.
# Free plan: ~1,000 searches/month -> keep this list under ~30 entries.
# Tavily ile web araması. Soru şeklinde yazabilirsin.
# Ücretsiz plan ayda ~1.000 arama: bu listeyi 30 maddenin altında tut.
searches:
  - Has a new stable Python version been released?
  # Public X / Instagram posts that search engines have indexed.
  # X / Instagram'da arama motorlarının dizinlediği herkese açık gönderiler.
  - query: open weights model release
    topic: Open models
    sites: [x.com, instagram.com]

# Pages to watch for changes. "css_selector" is optional: use it to watch
# only part of a page (e.g. "#main", ".announcements") and ignore noise.
# A newly added page is only recorded on its first day; changes are
# reported from the next day on.
# Değişikliği takip edilecek sayfalar. "css_selector" isteğe bağlıdır;
# sayfanın sadece bir bölümünü izlemek için kullan. Yeni eklenen sayfa
# ilk gün sadece kaydedilir, değişiklikler ertesi günden itibaren bildirilir.
pages:
  - name: Python downloads
    url: https://www.python.org/downloads/
    css_selector: ".download-list-widget"
  - name: Example page
    url: https://example.com/
    focus: Only mention changes to the opening hours.

# Optional: other people who get an e-mail with only some digest headings
# ("topic" names above, or a page name). Nothing is sent to them on days
# when none of their headings has news.
# İsteğe bağlı: bültenin sadece bazı başlıklarını e-postayla alacak kişiler.
# Başlıklarında yenilik olmayan günlerde onlara bir şey gitmez.
# recipients:
#   - email: friend@example.com
#     topics: [Open models]

# Gemini model used for the summary, and a fallback used when it is
# overloaded or unavailable. Both must be available on your plan.
# Özet için kullanılacak Gemini modeli ve yoğunluk/hata durumunda yedeği.
gemini_model: gemini-3.8-flash
gemini_fallback_model: gemini-3.6-flash

# When the digest is delivered, in the time zone below. Keep the quotes.
# Özetin gönderileceği saat (aşağıdaki saat diliminde). Tırnakları koru.
send_time: "08:00"
timezone: Europe/Istanbul

# Language of the digest: "tr" (Türkçe) or "en" (English).
# Özet dili.
summary_language: tr

# How far back web searches look: "day" or "week".
# Web aramasının ne kadar geriye bakacağı: "day" (gün) veya "week" (hafta).
search_time_range: day
